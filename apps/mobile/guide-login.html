<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guide Log In | Montalban Navigator</title>
    <link rel="stylesheet" href="../../frontend/mobile/css/portal.css" />
  </head>
  <body class="partner-guide-auth" data-auth-portal="guide">
    <header class="topbar">
      <a class="brand" href="guide-auth.html">
        <img class="brand-logo" src="../../assets/logos/tourism-logo.png" alt="Montalban Tourism logo" />
        <img class="brand-logo" src="../../assets/logos/montalban-logo.png" alt="Montalban logo" />
        <span>Guide access</span>
      </a>
    </header>
    <main class="page-shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Approved guides</p>
          <h1>Log in to manage your assigned tours.</h1>
          <p class="hero-text">Enter your email, then verify the six-digit code we send. Admin must approve your application first.</p>
        </div>
        <div class="hero-card">
          <div class="section-heading compact-heading">
            <p class="eyebrow">Log in</p>
            <h2>Guide credentials</h2>
          </div>
          <form id="guide-auth-login-form" class="booking-form">
            <label for="guide-auth-email">Email address</label>
            <input id="guide-auth-email" type="email" autocomplete="username" required />
            <div id="guide-auth-otp-group" hidden>
              <label for="guide-auth-code">Six-digit verification code</label>
              <input id="guide-auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" />
            </div>
            <button id="guide-auth-login-submit" class="btn btn-primary" type="submit">Send verification code</button>
            <button id="guide-auth-change-email" class="btn btn-secondary" type="button" hidden>Use a different email</button>
            <button class="btn btn-secondary" type="button" id="guide-auth-reset">Forgot password?</button>
            <p id="guide-auth-login-message" class="success-message" hidden></p>
          </form>
          <p class="guide-auth-switch">Not approved yet? <a href="guide-signup.html">Sign up here</a>.</p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../frontend/shared/config/supabase.public.js"></script>
    <script src="../../frontend/shared/js/state.js"></script>
    <script src="../../frontend/shared/js/email-otp-login.js"></script>
    <script src="../../frontend/mobile/js/guide-login.js"></script>
  </body>
</html>
